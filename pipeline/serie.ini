# Schede delle serie di fonti da importare con importa.py (OCR delle scansioni, intestazione, indice).
# Una sezione per serie: il nome della sezione è il nome della serie, come comparirà nelle citazioni.
#
# Campi:
#   tipo        periodico (un file per numero) | volume (un file per libro o raccolta)
#   lingua      codice della lingua del testo: sq, it, fr, en, de, es, ru, zh...
#   ocr_lingue  (facoltativo) lingue per l'OCR, se diverse: ad es. sqi+eng per testi albanesi con citazioni inglesi
#   cartella    dove vanno i testi, dentro data\  (per i periodici: riviste\<nome>, così li conta copertura_fonti)
#   sigla       prefisso dei nomi dei file dei periodici (ZP1967-01-12.txt)
#   citazione   modello della citazione. Segnaposto: {data} {numero} {anno} {titolo} {autore} {volume}
#               {luogo} {editore} {serie}. Un tratto tra [ ] sparisce se manca uno dei suoi segnaposto.
#   autore, titolo, luogo, editore, anno, volume   valori fissi (per i volumi), sostituibili file per file
#   nota_limiti (facoltativo) frase aggiunta alla sezione «Limiti» delle risposte che citano questa serie;
#               più frasi si separano con « | »
#   chicago     (facoltativo) modello della citazione in stile Chicago standard (nota) usato nelle risposte e,
#               all'importazione, per FULL_CITATION. Segnaposto in più: {pagina} {data_o_anno} {volume_lbl}
#               {rapporto} {data_rapporto} {serie_originale}
#               {numero_lbl} (no. N, nos. N–M) {contenitore} (supplemento, indice); *...* = corsivo. Senza questo campo vale il
#               modello predefinito del tipo (citazioni.py).
#   pagina_regex (facoltativo) espressione regolare con un gruppo che dà la pagina, per le serie che non usano
#               il marcatore [[p. N]] (es. 第N版 del Renmin Ribao)
#   titolo_fisso (facoltativo) titolo che sostituisce quello dell'intestazione nelle citazioni
#   ocr         no = serie già nel corpus, da non ripassare con l'OCR (il controllo delle lingue la salta)
#   data_interna (facoltativo) sì | no: dedurre dal testo la data di ogni documento della raccolta, per la
#               cronologia (date_interne.py). Senza il campo: sì per i file senza data completa che non sono
#               periodici, no per gli altri
#   data_interna_anni (facoltativo) anni ammessi per i documenti, es. 1949-1976 (senza: fino all'anno di edizione)
#   data_interna_distanza (facoltativo) caratteri massimi tra la data d'intestazione e il passaggio (30000)
#
# Per aggiungere una serie: copia un blocco e cambialo, oppure chiedi in Jan («crea la serie ...»).

[Zëri i Popullit]
tipo = periodico
lingua = sq
cartella = riviste/zeri_i_popullit
sigla = ZP
citazione = Zëri i Popullit, {data}[, n. {numero}]
chicago = *Zëri i Popullit*[, {numero_lbl}][, {contenitore}], {data_o_anno}[, {pagina}]
nota_limiti = La stampa albanese registra ciò che Tirana sceglieva di pubblicare: l'assenza in queste fonti non prova l'assenza dei fatti.

[Rruga e Partisë]
tipo = periodico
lingua = sq
cartella = riviste/rruga_e_partise
sigla = RP
citazione = Rruga e Partisë[, n. {numero}], {data}
chicago = *Rruga e Partisë*[, {numero_lbl}][, {contenitore}] ({data_o_anno})[: {pagina}]
nota_limiti = La stampa albanese registra ciò che Tirana sceglieva di pubblicare: l'assenza in queste fonti non prova l'assenza dei fatti.

# Esempio di volume (togli i "#" e completa i dati dal frontespizio):
# [Titolo della raccolta]
# tipo = volume
# lingua = sq
# cartella = opere/titolo_della_raccolta
# citazione = {autore}, {titolo}[, vol. {volume}], {luogo}: {editore}, {anno}
# autore = Cognome, Nome
# titolo = Titolo
# luogo = Tiranë
# editore = Editore

