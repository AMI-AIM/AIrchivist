# Una sezione [Nome canonico] per ogni entità cercata.
# varianti  = tutte le forme del nome, separate da ";" (caratteri semplificati e tradizionali, pinyin, Wade-Giles, epiteti).
#             Spazi/a capo dell'OCR tra i caratteri, punto centrale (·) e parentesi piene/mezze sono già tollerati.
# contesto  = parole che, se presenti nel passaggio, lo segnalano come più probabile. NON filtrano nulla.
# note      = indicazioni per l'AI che legge i passaggi (omonimie da escludere, periodo, ecc.).
# Le forme marcate "ipotesi" vanno verificate sul corpus: sono proposte, non dati attestati.

[Nuova Unità]
varianti = 新团结月刊; 新團結月刊; 《新团结》; 新团结; Nuova Unità; Nuova Unita; New Unity; 《新团结》周刊; 《新团结》报; 《新团结报》; 意《新团结报》
contesto = 意大利; Italia; Italy; Italian
note = Periodico marxista-leninista italiano (dal 1964). Escludere omonimi stranieri (es. organizzazioni o testate tedesche) e l'uso generico dell'espressione 新团结 non riferito a una testata. Forme attestate nel Renmin Ribao: 《新团结月刊》 (2/12/1964), 《新团结》报 (15/7/1966), 《新团结》周刊 (30/1/1967, 29/1/1968). New Unity: ipotesi. Nel Renmin Ribao 《新团结报》 o 《新团结》 accanto al PCd'I (m-l) (意大利共产党（马列）, 意大利共产党（马克思列宁主义）) indica Nuova Unità, organo di quel partito, anche se il testo non dice «意大利»; accanto al KPD/ML (德国共产党（马列）) è invece la «Neue Einheit» tedesca. Nella Peking Review «Malian paper Nuova Unita» è un errore di OCR per «Italian paper».

