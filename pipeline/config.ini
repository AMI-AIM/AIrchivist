# Configurazione del motore di ricerca (modelli, router, parametri). I percorsi relativi partono dalla cartella
# "pipeline".

[progetto]
# Cartella del progetto di ricerca in uso: dati, schede, serie, risultati, risposte, indice (progetto.py).
# Si può scegliere anche con la variabile d'ambiente AIRCHIVIST_PROGETTO, che prevale.
# Un progetto nuovo: python progetto.py nuovo <cartella> --nome "..."; quello in uso: python progetto.py stato
cartella = ..

# [percorsi] valeva prima dei progetti: con un progetto scelto non conta. Per spostare un file di un progetto
# si usa la sezione [percorsi] del suo progetto.ini.

[mcp]
# Server MCP (mcp_server.py, istruzioni.py). Lingua delle risposte dell'IA della chat.
lingua = italiano
# Secondi massimi di ogni attesa di ricerca (azione attendi): sotto il tempo che il client concede a uno
# strumento (in Jan 90 s, impostato nelle opzioni MCP).
attesa_massima = 75
# Caratteri massimi del risultato di uno strumento: sotto il limite del client (in Jan 8000, «maxToolOutputChars»
# in mcp_config.json). Oltre, il server accorcia le parti più lunghe e lo dice, invece di lasciare che il client
# tagli il JSON a metà.
max_caratteri = 7500

[modello]
# Quale servizio usare:
#   anthropic = Claude via API (a consumo; chiave in ANTHROPIC_API_KEY)
#   openai    = servizi compatibili OpenAI, anche gratuiti (vedi la sezione [openai] sotto)
#   router    = FreeLLMAPI sul tuo PC: passa da un servizio gratuito all'altro (vedi la sezione [router])
#   ollama    = modello locale con Ollama
backend = router
# Secondi massimi di attesa per una risposta
timeout = 300
# Lunghezza massima di ogni risposta del modello, per ruolo (impedisce risposte che non finiscono mai).
# I modelli che "ragionano" prima di rispondere ne consumano una parte: con limiti bassi il JSON arriva troncato.
max_token = 4000
max_token_smistamento = 4000
max_token_analisi = 4000
max_token_sintesi = 8000

[anthropic]
modello_smistamento = claude-haiku-5-5
modello_analisi = claude-sonnet-5-5
modello_sintesi = claude-sonnet-5-5
pausa_secondi = 0

[openai]
# Un solo servizio alla volta: lascia attivo un blocco e commenta gli altri con "#".
# Verifica i nomi esatti dei modelli nella console del servizio: cambiano spesso.
#
# --- Groq (piano gratuito). Qwen 3.8 27B: ottimo con il cinese, "ragionamento" disattivato. ---
# Qwen su Groq è in "anteprima": se sparisce, usa llama-3.3-70b-versatile (stabile) e togli parametri_extra.
url = https://api.groq.com/openai/v1
chiave_env = GROQ_API_KEY
modello_smistamento = qwen/qwen3.8-27b
modello_analisi = qwen/qwen3.8-27b
modello_sintesi = qwen/qwen3.8-27b
parametri_extra = {"reasoning_effort": "none"}
# pausa tra le richieste per restare sotto il limite di token al minuto del piano gratuito
pausa_secondi = 6
#
# --- Google Gemini (piano gratuito sui modelli Flash; i testi possono essere usati da Google) ---
# url = https://generativelanguage.googleapis.com/v1beta/openai
# chiave_env = GEMINI_API_KEY
# modello_smistamento = gemini-3.5-flash-lite
# modello_analisi = gemini-3.8-flash
# modello_sintesi = gemini-3.8-flash
# pausa_secondi = 5
#
# --- OpenRouter (modelli con nome che finisce in ":free"; 50 richieste al giorno senza acquisti) ---
# url = https://openrouter.ai/api/v1
# chiave_env = OPENROUTER_API_KEY
# modello_smistamento = <nome-modello>:free
# modello_analisi = <nome-modello>:free
# modello_sintesi = <nome-modello>:free
# pausa_secondi = 3.5
#
json = si

[router]
# FreeLLMAPI (https://github.com/tashfeenahmed/freellmapi), avviato sul tuo PC. Indirizzo: pagina Chiavi > Chiave API unificata > "URL di base" (app desktop: 31415; versione da sorgente o Docker: 3001).
url = http://127.0.0.1:31415/v1
# chiave unica "freellmapi-...", dalla pagina Keys del pannello: setx FREELLMAPI_KEY "..."
chiave_env = FREELLMAPI_KEY
# "auto:ricerca" = la catena di riserva chiamata "ricerca" che crei nel pannello, con soli modelli verificati
modello_smistamento = auto:ricerca
modello_analisi = auto:ricerca
modello_sintesi = auto:ricerca
# Rete di sicurezza: parti del nome dei modelli accettati (come appaiono nella colonna "modello" di
# classificati.csv), separate da ";". Se risponde un modello diverso, la classificazione si ferma.
# Aggiungi un modello solo dopo averlo provato con valutazione.py (prova rapida: valutazione.py modelli).
# Lo stesso modello risponde con nomi diversi a seconda del servizio (ollama/gpt-oss:20b, groq/openai/gpt-oss-20b):
# per ognuno ci sono la forma con i due punti e quella con il trattino.
# 22/10/2026, prova rapida su 97 passaggi verificati: gpt-oss-20b, gemma-4-31b, gpt-oss-120b.
modelli_ammessi =
pausa_secondi = 2
json = si

[ollama]
url = http://localhost:11434
modello_smistamento = qwen3.5:4b
modello_analisi = qwen3.5:9b
modello_sintesi = qwen3.5:9b
num_ctx = 4096

[estrazione]
# Caratteri di contesto per lato attorno a ogni occorrenza (file passaggi.csv)
finestra = 400
# Caratteri per lato inviati al modello per lo smistamento: meno testo = meno token e più velocità
finestra_modello = 300
# Passaggi smistati (pertinente sì/no) con una sola richiesta: con i piani gratuiti conta il numero di richieste
lotto_smistamento = 6
# si = salta lo smistamento quando il passaggio contiene una forma del nome che non lascia dubbi
#      (es. 雅克·格里巴, sigle con parentesi, nome e cognome per intero); no = smista sempre
forme_sicure = si

[ocr]
# Importazione di nuovo materiale (importa.py). Lascia vuoto per cercare Tesseract nelle cartelle consuete.
tesseract =
# Cartella dei modelli delle lingue (vuoto = quella dell'installazione di Tesseract)
modelli =
