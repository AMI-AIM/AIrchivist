# Configurazione del motore di ricerca (modelli, router, parametri). I percorsi relativi partono dalla cartella
# "scripts".

[progetto]
# Cartella del progetto di ricerca in uso: dati, schede, serie, risultati, risposte, indice (progetto.py). I progetti
# stanno di solito in projects/, accanto al motore e fuori da git.
# Si può scegliere anche con la variabile d'ambiente PRESSMARK_PROGETTO, che prevale.
# Un progetto nuovo: python progetto.py nuovo ../projects/<nome> --nome "..."; quello in uso: python progetto.py stato
cartella =

# [percorsi] valeva prima dei progetti: con un progetto scelto non conta. Per spostare un file di un progetto
# si usa la sezione [percorsi] del suo project.ini.

[conversazione]
# Conversazione sulle fonti nell'interfaccia (conversazione.py, istruzioni.py). Lingua delle risposte dell'IA.
lingua = italiano
# Secondi massimi di ogni attesa di ricerca (azione attendi): poi il modello dice a che punto è e torna ad attendere.
attesa_massima = 75
# Caratteri massimi del risultato di uno strumento. Oltre, si accorciano le parti più lunghe e lo si dice, invece di
# tagliare il JSON a metà.
max_caratteri = 7500

[modello]
# Il modello si sceglie con un profilo di models.ini (Impostazioni > Modelli, o python installa.py modello nuovo):
#   profilo = <nome>     per tutti i ruoli; smistamento, analisi, sintesi = <nome> per un ruolo solo.
# Le scelte dell'utente non si scrivono qui ma nel suo file di configurazione (posizioni.py).
# Secondi massimi di attesa per una risposta (con un router, se il profilo non dice altro, al più 120: la richiesta
# si ripete e il router può mandarla a un altro fornitore)
timeout = 300
# Dopo quanti secondi senza risposta la lettura lo scrive, e dopo quanti si ferma (si rilancia più tardi)
avviso_dopo = 120
ferma_dopo = 600
# Richieste contemporanee: vuoto = 3 con un router, 1 con un servizio solo (il profilo può indicarlo)
# paralleli = 3
# Lunghezza massima di ogni risposta del modello, per ruolo (impedisce risposte che non finiscono mai).
# I modelli che "ragionano" prima di rispondere ne consumano una parte: con limiti bassi il JSON arriva troncato.
max_token = 4000
max_token_smistamento = 4000
max_token_analisi = 4000
max_token_sintesi = 8000

[estrazione]
# Caratteri di contesto per lato attorno a ogni occorrenza (file passaggi.csv)
finestra = 400
# Caratteri per lato inviati al modello per lo smistamento: meno testo = meno token e più velocità
finestra_modello = 300
# Passaggi smistati (pertinente sì/no) con una sola richiesta: con i piani gratuiti conta il numero di richieste
lotto_smistamento = 6
# Passaggi pertinenti tradotti e analizzati con una sola richiesta (1 = uno per uno), e caratteri massimi di testo
# di un lotto
lotto_analisi = 3
lotto_analisi_caratteri = 6000
# si = salta lo smistamento quando il passaggio contiene una forma del nome che non lascia dubbi
#      (es. sigle con parentesi, nome e cognome per intero); no = smista sempre
forme_sicure = si

[ocr]
# Importazione di nuovo materiale (importa.py). Lascia vuoto per cercare Tesseract nelle cartelle consuete.
tesseract =
# Cartella dei modelli delle lingue (vuoto = quella dell'installazione di Tesseract)
modelli =

[disattivati]
