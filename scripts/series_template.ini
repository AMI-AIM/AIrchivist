# Modello di series.ini per i progetti nuovi (progetto.py nuovo): solo la descrizione dei campi e degli esempi.
# Le serie di un progetto stanno in glossary/series.ini della sua cartella.
#
# Schede delle serie di fonti da importare con importa.py (OCR delle scansioni, intestazione, indice).
# Una sezione per serie: il nome della sezione è il nome della serie, come comparirà nelle citazioni.
# Il modo più semplice di crearle: python importa.py proponi <cartella dei documenti> (tabella da controllare),
# oppure dalla chat («crea la serie ...»).
#
# ---- Campi essenziali (bastano questi tre) ----
#   [nome]      il nome della sezione: il nome della serie, come nelle citazioni
#   tipo        periodico  fascicoli di un giornale o di una rivista, un file per numero, con la data del numero
#               articolo   articoli di una rivista, un file per articolo, con autore e titolo
#               volume     un libro o una raccolta, un file per volume
#               archivio   documenti d'archivio datati (rapporti, lettere, verbali), un file per documento
#   lingua      codice della lingua del testo: sq, it, fr, en, de, es, ru, zh...
#
# Con i soli campi essenziali: la cartella dentro data è riviste/<nome> (periodico, articolo), volumi/<nome> o
# archivi/<nome>; la sigla dei nomi dei file sono le iniziali del nome (Zëri i Popullit -> ZP); la citazione
# Chicago (nota) si genera dal tipo:
#   periodico, articolo  Nome Cognome, “Titolo,” *Rivista* 121, no. 2 (aprile 2016): 377
#                        *Giornale*, 12 gennaio 1967, 3              (senza volume né numero: forma del quotidiano)
#   volume               Nome Cognome, *Titolo*, vol. 2 (Luogo: Editore, 1971), 45
#   archivio             Nome Cognome, “Titolo,” 3 marzo 1971, segnatura, fondo, archivio, luogo, 12
# L'autore si scrive nell'intestazione come «Cognome, Nome» (più autori separati da «;»): nella nota diventa
# «Nome Cognome».
#
# ---- Campi avanzati (facoltativi) ----
#   cartella    dove vanno i testi, dentro data\ (i periodici in riviste\, così li conta copertura_fonti)
#   sigla       prefisso dei nomi dei file datati (ZP1967-01-12.txt)
#   chicago     modello della citazione Chicago (nota), al posto di quello del tipo, usato nelle risposte e
#               all'importazione per FULL_CITATION. Segnaposto: {serie} {titolo} {titolo_articolo} {autore}
#               {autore_nota} {volume} {volume_lbl} {numero_lbl} (no. N, nos. N–M) {contenitore} (supplemento,
#               indice) {data} {anno} {data_o_anno} {luogo} {editore} {pagina} {rapporto} {data_rapporto}
#               {serie_originale} {fondo} {archivio} {segnatura}. Un tratto tra [ ] sparisce se manca uno dei suoi
#               segnaposto; *...* = corsivo
#   citazione   vecchio modello della citazione breve (FULL_CITATION delle serie create prima del 26/10/2026):
#               se c'è e manca chicago, all'importazione vale questo
#   autore, titolo, luogo, editore, anno, volume   valori fissi (per i volumi), sostituibili file per file
#   archivio, fondo, segnatura   (archivio) nome e luogo dell'archivio, fondo o collezione, segnatura: valori fissi
#               della serie; nell'intestazione dei file ARCHIVE, COLLECTION, CALL_NUMBER. Senza archivio: il nome
#               della serie
#   ocr_lingue  lingue per l'OCR, se diverse: ad es. sqi+eng per testi albanesi con citazioni inglesi
#   nota_limiti frase aggiunta alla sezione «Limiti» delle risposte che citano questa serie; più frasi con « | »
#   pagina_regex espressione regolare con un gruppo che dà la pagina, per le serie che non usano il marcatore
#               [[p. N]] (es. 第N版 del Renmin Ribao)
#   titolo_fisso titolo che sostituisce quello dell'intestazione nelle citazioni
#   ocr         no = serie già nel corpus, da non ripassare con l'OCR (il controllo delle lingue la salta)
#   data_interna sì | no: dedurre dal testo la data di ogni documento della raccolta, per la cronologia
#               (date_interne.py). Senza il campo: sì per i file senza data completa che non sono periodici
#   data_interna_anni anni ammessi per i documenti, es. 1949-1976 (senza: fino all'anno di edizione)
#   data_interna_distanza caratteri massimi tra la data d'intestazione e il passaggio (30000)
#   periodo     (periodici) primo e ultimo numero disponibili, es. 1963-01-01 / 1980-12-31: la cronologia calcola
#               fin lì i silenzi finali
#   periodicita (periodici) quotidiano | settimanale | quindicinale | mensile; i cambi con l'anno: «mensile; 1980:
#               quindicinale». Serve a collocare nel mese le lacune dei fascicoli indicati per numero (PR1967-11)
#   gruppo      nome comune delle serie da cercare insieme (Hongqi e Red Flag: gruppo = Hongqi)
#   righe_intere sì = testo digitale con un paragrafo per riga: i nomi non si spezzano tra due righe e l'indice
#               sceglie con certezza i file da leggere
#   ordine_lettura colonne | pdf: come leggere lo strato di testo dei PDF. colonne = blocchi rimessi nell'ordine
#               delle colonne (giornali a più colonne); pdf = l'ordine in cui sono scritti nel file. Predefinito:
#               colonne per i periodici, pdf per gli altri
#   allinea_con serie in cui esplora_nome cerca i nomi trascritti nei giorni prima di ogni numero di questa serie
#               che nomina la persona (allinea_giorni = quanti giorni, predefinito 21)
#
# Un file appartiene a un profilo per il nome della serie ([SERIES]), altrimenti per la cartella (la più
# specifica). Lettura e regole: profili.py; citazioni: citazioni.py.
#
# Esempi (togli i «#» e cambia i valori):
# [Zëri i Popullit]
# tipo = periodico
# lingua = sq
#
# [The World Today]
# tipo = articolo
# lingua = en
#
# [Central Intelligence Agency]
# tipo = archivio
# lingua = en
# archivio = CIA FOIA Electronic Reading Room
