# Profili dei modelli (lavoro 26). Si copia in scripts/models.ini, che resta fuori da git, oppure si creano i
# profili con la procedura guidata:  python installa.py modello nuovo
#
# Ogni sezione è un profilo: un servizio e un modello, con i parametri propri di quel modello. Quale profilo usare
# si sceglie in config.ini (o nel project.ini del progetto, che prevale), sezione [modello]:
#     profilo = groq-qwen              per tutti i ruoli
#     sintesi = ollama-qwen-9b         facoltativo: un profilo diverso per un ruolo (smistamento, analisi, sintesi)
# Per cambiare profilo:  python installa.py modello usa <profilo>  (prova prima il collegamento).
#
# Voci di un profilo:
#   servizio        anthropic | openai (compatibile OpenAI: Groq, Gemini, OpenRouter, LM Studio...) |
#                   router (FreeLLMAPI) | ollama
#   modello         nome esatto del modello presso il servizio
#   url             indirizzo del servizio (non serve per anthropic)
#   chiave_env      NOME della variabile d'ambiente con la chiave: la chiave non si scrive mai in questo file
# Facoltative (se mancano valgono i valori della sezione [modello] di config.ini o quelli predefiniti):
#   timeout         secondi massimi di attesa per una risposta (300)
#   max_token       lunghezza massima della risposta (4000); max_token_smistamento, max_token_analisi,
#                   max_token_sintesi per un ruolo solo. I modelli che "ragionano" ne consumano una parte.
#   pausa_secondi   pausa tra le richieste, per restare nei limiti dei piani gratuiti (0)
#   json            si | no: chiede al servizio la modalità JSON (openai, router; si)
#   parametri_extra oggetto JSON aggiunto a ogni richiesta (openai, router)
#   num_ctx         contesto in token (ollama; 4096)
#   modelli_ammessi parti del nome dei modelli accettati, separate da ";" (router): se risponde un modello
#                   diverso la lettura si ferma. Vuoto = qualsiasi modello.
#
# I nomi dei modelli cambiano spesso: verificali nella console del servizio.

# Groq, piano gratuito. Qwen 3.8 27B: ottimo con il cinese, "ragionamento" disattivato. È in "anteprima": se
# sparisce, usa llama-3.3-70b-versatile (stabile) e togli parametri_extra.
[groq-qwen]
servizio = openai
url = https://api.groq.com/openai/v1
modello = qwen/qwen3.8-27b
chiave_env = GROQ_API_KEY
parametri_extra = {"reasoning_effort": "none"}
pausa_secondi = 6
max_token_sintesi = 8000

# Google Gemini, piano gratuito sui modelli Flash (i testi possono essere usati da Google).
[gemini-flash]
servizio = openai
url = https://generativelanguage.googleapis.com/v1beta/openai
modello = gemini-3.8-flash
chiave_env = GEMINI_API_KEY
pausa_secondi = 5
max_token_sintesi = 8000

# OpenRouter: modelli con nome che finisce in ":free" (50 richieste al giorno senza acquisti).
[openrouter-free]
servizio = openai
url = https://openrouter.ai/api/v1
modello = <nome-modello>:free
chiave_env = OPENROUTER_API_KEY
pausa_secondi = 3.5

# Ollama sul tuo computer: gratuito, nessuna chiave. Il modello si scarica con: ollama pull qwen3.5:9b
[ollama-qwen-9b]
servizio = ollama
url = http://localhost:11434
modello = qwen3.5:9b
num_ctx = 4096
max_token_sintesi = 8000

[ollama-qwen-4b]
servizio = ollama
url = http://localhost:11434
modello = qwen3.5:4b
num_ctx = 4096

# API di Anthropic: a consumo.
[claude-sonnet]
servizio = anthropic
modello = claude-sonnet-5-5
chiave_env = ANTHROPIC_API_KEY
max_token_sintesi = 8000

[claude-haiku]
servizio = anthropic
modello = claude-haiku-5-5
chiave_env = ANTHROPIC_API_KEY

# FreeLLMAPI (https://github.com/tashfeenahmed/freellmapi) avviato sul tuo PC: passa da un servizio gratuito
# all'altro. "auto:ricerca" è la catena di riserva chiamata "ricerca" creata nel pannello. Indirizzo: pagina
# Chiavi > Chiave API unificata > "URL di base" (app desktop: 31415; da sorgente o Docker: 3001).
[freellmapi-ricerca]
servizio = router
url = http://127.0.0.1:31415/v1
modello = auto:ricerca
chiave_env = FREELLMAPI_KEY
pausa_secondi = 2
max_token_sintesi = 8000
# Aggiungi un modello solo dopo averlo provato con valutazione.py. Lo stesso modello risponde con nomi diversi a
# seconda del servizio (ollama/gpt-oss:20b, groq/openai/gpt-oss-20b): metti la forma con i due punti e quella
# con il trattino.
modelli_ammessi =
